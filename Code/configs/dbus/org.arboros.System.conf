<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- System service ownership -->
  <policy user="root">
    <allow own_prefix="org.arboros"/>
    <allow send_destination_prefix="org.arboros"/>
    <allow receive_sender_prefix="org.arboros"/>
  </policy>

  <!-- User session access rules -->
  <policy context="default">
    <allow send_destination_prefix="org.arboros"/>
    <allow receive_sender_prefix="org.arboros"/>
  </policy>
</busconfig>
